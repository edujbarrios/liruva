name: Real application screenshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    # Only allow screenshot extraction on this first-party development branch.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/milestone-2-2-safety-and-screenshot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI screenshot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev libasound2-dev xvfb xauth xdotool imagemagick file libgl1-mesa-dri libegl1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build LIRUVA desktop app
        run: cargo build -p liruva
      - name: Capture real running application
        run: |
          mkdir -p screenshots
          xvfb-run -a -s "-screen 0 1440x960x24" bash scripts/capture-screenshot.sh screenshots/liruva-dark-studio.png
      - name: Upload verified screenshot
        uses: actions/upload-artifact@v4
        with:
          name: liruva-running-app-screenshot
          path: screenshots/liruva-dark-studio.png
          if-no-files-found: error
      - name: Emit screenshot bytes for repository import
        run: |
          echo LIRUVA_SCREENSHOT_BASE64_START
          base64 -w 4096 screenshots/liruva-dark-studio.png
          echo LIRUVA_SCREENSHOT_BASE64_END
